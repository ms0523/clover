<section class="clover-value" data-value-section>
  <div class="clover-value__track">
    <div class="clover-value__stage">
      <div class="clover-value__heading">
        <h2 class="clover-value__title">선물을 고르는 기준부터 달라져야 하니까</h2>
        <p class="clover-value__description">
          상품을 찾기 전에 누구에게, 어떤 마음으로, 무엇을 선물할지 먼저 생각합니다.
        </p>
      </div>

      <div class="clover-value__red-band" aria-hidden="true"></div>

      <div class="clover-value__cards">
        <article class="value-card" data-value-card="0">
          <img class="value-card__image value-card__image--blur" src="__V01_BLUR__" alt="" />
          <img class="value-card__image value-card__image--sharp" src="__V01_SHARP__" alt="" />

          <div class="value-card__shade" aria-hidden="true"></div>

          <div class="value-card__top">
            <span class="value-card__number">01</span>
            <span class="value-card__category">관심사<span class="value-card__dot">·</span>취향<span class="value-card__dot">·</span>일상</span>
          </div>

          <div class="value-card__bottom">
            <h3 class="value-card__headline">그 사람이 좋아하는 것부터</h3>
            <p class="value-card__copy">
              평소의 취향과 최근의 관심사를 살펴 무엇을 좋아할지 고민하는 시간을 줄여요.
            </p>
          </div>
        </article>

        <article class="value-card" data-value-card="1">
          <img class="value-card__image value-card__image--blur" src="__V02_BLUR__" alt="" />
          <img class="value-card__image value-card__image--sharp" src="__V02_SHARP__" alt="" />

          <div class="value-card__shade" aria-hidden="true"></div>

          <div class="value-card__top">
            <span class="value-card__number">02</span>
            <span class="value-card__category">친구<span class="value-card__dot">·</span>연인<span class="value-card__dot">·</span>가족</span>
          </div>

          <div class="value-card__bottom">
            <h3 class="value-card__headline">우리 사이에 맞는 만큼</h3>
            <p class="value-card__copy">
              관계에 따라 선물의 가격과 의미를 고려해 서로 부담스럽지 않은 선택을 도와요.
            </p>
          </div>
        </article>

        <article class="value-card" data-value-card="2">
          <img class="value-card__image value-card__image--blur" src="__V03_BLUR__" alt="" />
          <img class="value-card__image value-card__image--sharp" src="__V03_SHARP__" alt="" />

          <div class="value-card__shade" aria-hidden="true"></div>

          <div class="value-card__top">
            <span class="value-card__number">03</span>
            <span class="value-card__category">메시지<span class="value-card__dot">·</span>의미<span class="value-card__dot">·</span>기억</span>
          </div>

          <div class="value-card__bottom">
            <h3 class="value-card__headline">‘나를 생각했구나’가 느껴지도록</h3>
            <p class="value-card__copy">
              상품 하나를 고르는 데서 끝나지 않고 선물을 고른 이유와 마음까지 함께 전해요.
            </p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
