<section class="hero-stage">
  <div class="reveal" aria-label="Clover hero">
    <div class="hero-side-line hero-side-line--left">
      <span class="dot"></span>
      <span class="tick tick--out"></span>
    </div>
    <div class="hero-side-line hero-side-line--right">
      <span class="dot"></span>
      <span class="tick tick--out"></span>
    </div>

    <img class="hero-logo" src="__LOGO_URL__" alt="CLOVER — Celebrate, For someone you Cherish, Remember about them">

    <p class="hero-copy">
      소중한 사람에게, 더 잘 맞는 선물을 고를 수 있도록<br>
      <span class="accent">기억해둔 단서</span>를 바탕으로
      <span class="accent">선물의 방향성</span>을 함께 찾아드려요
    </p>

    <div class="hero-cta-group">
      <img class="hero-cta-ribbon" src="__RIBBON_URL__" alt="">
      <button class="hero-cta" type="button">클로버와 선물하기</button>
    </div>

    

  <div class="paper">
    <img class="paper-logo" src="__WHITE_LOGO_URL__" alt="">
  </div>

<div class="track">
  <div class="cut-line"></div>
  <div class="ahead-line"></div>
</div>

<span class="open-label">open</span>
<span class="drag-hint">가위를 드래그해서 선물을 준비해보세요!</span>

<div class="scissors">
  <img src="__SCISSORS_URL__" alt="가위" draggable="false">
</div>
 
</section>
