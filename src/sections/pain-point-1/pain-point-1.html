<div class="pain-point-flow" data-pain-point-flow>
  <!-- 01. Why / scattered gift thoughts -->
  <section class="pain-point-1" data-pain-point-1>
  <div class="pain-point-1__stage">
    <h2 class="pain-point-1__title" data-pp1-reveal>
      선물은 왜 매번 고르기 어려울까요?
    </h2>

    <div class="pain-point-1__product pain-point-1__product--notebook" data-pp1-float="1" data-pp1-pair="1">
      <img src="__NOTEBOOK__" alt="노트" />
    </div>

    <div class="pain-point-1__product pain-point-1__product--glove" data-pp1-float="2" data-pp1-pair="3" data-shared-glove-source>
      <img src="__GLOVE__" alt="겨울 장갑" data-shared-glove-source-image />
    </div>

    <div class="pain-point-1__product pain-point-1__product--handcream" data-pp1-float="3" data-pp1-pair="5">
      <img src="__HANDCREAM__" alt="핸드크림" />
    </div>

    <div class="pain-point-1__product pain-point-1__product--fan" data-pp1-float="4" data-pp1-pair="2">
      <img src="__FAN__" alt="휴대용 선풍기" />
    </div>

    <div class="pain-point-1__product pain-point-1__product--tumbler" data-pp1-float="5" data-pp1-pair="4">
      <img src="__TUMBLER__" alt="텀블러" />
    </div>

    <div class="pain-point-1__bubble pain-point-1__bubble--need" data-pp1-reveal data-pp1-pair="1">
      이 제품을 필요로 할까?
    </div>

    <div class="pain-point-1__bubble pain-point-1__bubble--like" data-pp1-reveal data-pp1-pair="3">
      얘가 이걸 좋아할까...
    </div>

    <div class="pain-point-1__bubble pain-point-1__bubble--similar" data-pp1-reveal data-pp1-pair="2">
      비슷한 제품이 있었던가?
    </div>

    <div class="pain-point-1__bubble pain-point-1__bubble--heart" data-pp1-reveal data-pp1-pair="4">
      정성과 마음이 잘 보일까?
    </div>

    <div class="pain-point-1__bubble pain-point-1__bubble--common" data-pp1-reveal data-pp1-pair="5">
      너무 뻔한 선물같아..
    </div>
  </div>
</section>

  <!-- 02. Detailed pain points -->
  <section class="pain-points" data-step="0">
  <div class="pain-points-track">
    <div class="pain-points-stage">
      <div class="pain-points-stage-content">
        <div class="pain-points-inner">
          <div class="featured-card">
            <div class="featured-card-product" data-card-part="0">
              <div class="featured-card-img" data-shared-glove-target>
                <img src="__GLOVE__" alt="겨울 장갑" data-shared-glove-target-image />
              </div>
              <div class="featured-card-name">겨울 장갑</div>
            </div>

            <div class="featured-card-price" data-card-part="1">₩29,500</div>

            <div class="featured-card-rule"></div>

            <div class="featured-card-reason" data-card-part="2">
              <span class="featured-card-reason-label">이유</span>
              <span>겨울에는 손이 시리니까</span>
            </div>
          </div>

          <div class="featured-divider" aria-hidden="true">
            <div class="featured-divider-active"></div>
          </div>

          <div class="featured-points">
            <p class="point" data-point="0">취향을 알아도 확신하기 어려워요</p>
            <p class="point" data-point="1">관계에 맞는 가격을 정하기 어려워요</p>
            <p class="point" data-point="2">내 마음이 잘 전달될지도 고민돼요</p>
          </div>
        </div>

        <p class="pain-points-statement" aria-live="polite">
          <span>선물이 어려운 이유는 상품이 부족해서가 아니라,</span>
          <strong>이 사람에게 지금 어떤 선물이 적절할지 판단하기 어렵기 때문입니다.</strong>
        </p>
      </div>
    </div>
  </div>
</section>
</div>
