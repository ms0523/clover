<section class="clover-start" data-clover-start>
  <div class="clover-start__sticky">
    <div class="clover-start__world" data-clover-start-world>
      <figure class="clover-start__media clover-start__media--memory" data-start-media>
        <img src="__MEMORY__" alt="" />
      </figure>

      <figure class="clover-start__media clover-start__media--logo" data-start-media>
        <img src="__LOGO__" alt="CLOVER 로고" />
      </figure>

      <figure class="clover-start__media clover-start__media--service" data-start-media>
        <img src="__SERVICE__" alt="" />
      </figure>

      <figure class="clover-start__media clover-start__media--couple" data-start-media>
        <img src="__COUPLE__" alt="" />
      </figure>

      <figure class="clover-start__media clover-start__media--phone" data-start-media>
        <img src="__PHONE__" alt="" />
      </figure>

      <figure class="clover-start__media clover-start__media--friends" data-start-media>
        <img src="__FRIENDS__" alt="" />
      </figure>

      <figure class="clover-start__media clover-start__media--gift" data-start-media>
        <img src="__GIFT__" alt="" />
      </figure>

      <figure class="clover-start__media clover-start__media--character" data-start-media>
        <img src="__CHARACTER__" alt="" />
      </figure>
    </div>

    <div class="clover-start__center" data-clover-start-center>
      <h2 class="clover-start__title">
        <span class="clover-start__title-line clover-start__title-line--primary">
          선물의 시작을
        </span>
        <span class="clover-start__title-line clover-start__title-line--secondary" data-start-secondary>
          상품에서 사람으로
        </span>
      </h2>
    </div>

    <button
      class="clover-start__scroll-mark"
      data-start-arrow
      type="button"
      aria-label="다음 섹션으로 이동"
    >
      <img src="__CHEVRON__" alt="" />
    </button>
  </div>
</section>
