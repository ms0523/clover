<section class="intro">
  <!-- two independent background zones — style each separately in
       intro.css (.bg-zone--intro / .bg-zone--board) -->
  <div class="bg-zone bg-zone--intro"></div>
  <div class="bg-zone bg-zone--board">
    <img src="__CLUEBOARD_DOTS_URL__" alt="">
  </div>

  <div class="intro-inner">
    <!-- copy scrolls away naturally — no JS fade, just normal scrolling -->
    <div class="intro-copy" data-copy>
      <p class="intro-sub">클로버는 상품부터가 아닌</p>
      <h2 class="intro-heading" data-type="main"></h2>
    </div>

    <!-- these 4 elements are the SAME elements the whole time: they land
         here once, then later fly directly into the phone below once it
         scrolls into view (see intro.js) — never swapped for a copy. -->
    <div class="photo-cluster">
      <div class="photo-el tag-blue" data-photo data-photo-key="blue" style="background-image:url('__BLUE_URL__')">
        <span>실용적인 선물 좋아함</span>
      </div>

      <img class="photo-el picnic-photo" data-photo data-photo-key="photo2" src="__PICNIC_URL__" alt="">

      <figure class="photo-el polaroid" data-photo data-photo-key="photo1">
        <img src="__FLOWER_URL__" alt="">
      </figure>

      <div class="photo-el tag-pink" data-photo data-photo-key="pink" style="background-image:url('__PINK_URL__')">
        <span>아기자기한 소품</span>
      </div>
    </div>

    <!-- sits further down the page — scrolls up into view naturally -->
    <div class="phone" data-phone>
      <img class="phone-bg" src="__PHONE_URL__" alt="">

      <div class="phone-screen">
        <div class="phone-statusbar">
          <span>09:41</span>
          <span class="phone-icons">
            <svg viewBox="0 0 18 12" class="icon-signal"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="4.5" width="3" height="7.5" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
            <svg viewBox="0 0 16 12" class="icon-wifi"><path d="M8 10.5a1 1 0 100-2 1 1 0 000 2z"/><path d="M8 8.2c-1 0-1.9.4-2.6 1l-1-1.1a5.4 5.4 0 017.2 0l-1 1a3.6 3.6 0 00-2.6-1z"/><path d="M8 5.6c-1.7 0-3.3.7-4.5 1.9l-1-1.1A7.7 7.7 0 018 4.1a7.7 7.7 0 015.5 2.3l-1 1a6 6 0 00-4.5-1.8z"/></svg>
            <svg viewBox="0 0 24 12" class="icon-battery"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="17" height="8" rx="1.3" fill="currentColor"/><rect x="21.5" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
          </span>
        </div>

        <div class="phone-header"><span class="back">‹</span> 민시리의 단서 보드</div>

        <div class="phone-board" data-phone-board>
          <img class="phone-board-dots" src="__CLUEBOARD_DOTS_URL__" alt="">
          <div class="note note-blue" data-note="blue"><span>실용적인 선물 좋아함</span></div>
          <figure class="note note-photo1" data-note="photo1">
            <img src="__FLOWER_URL__" alt="">
          </figure>
          <figure class="note note-photo2" data-note="photo2">
            <img src="__PICNIC_URL__" alt="">
          </figure>
          <div class="note note-pink" data-note="pink"><span>아기자기한 소품</span></div>
        </div>

        <div class="phone-input">
          <div class="phone-input-pill">
            <span class="phone-input-text">어떤 선물 추천해드릴끼니?</span>
            <span class="phone-send-btn">
              <svg viewBox="0 0 12 12" width="10" height="10"><path d="M6 10V2M6 2L2.5 5.5M6 2l3.5 3.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </span>
          </div>
          <span class="phone-input-btn">+</span>
        </div>
      </div>
    </div>

    <div class="step1-copy" data-step1>
      <p class="step1-label">STEP 01</p>
      <h3>선물을 할 사람에 대한 단서를 남겨보세요</h3>
      <p class="step1-desc">평소 기억해둔 이야기부터, 지금 떠오르는 정보까지 자유롭게 남길 수 있어요.</p>
    </div>
  </div>
</section>
