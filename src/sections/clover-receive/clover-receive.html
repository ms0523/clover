<section class="receive-band">
  <div class="receive-bg"></div>

  <div class="receive-inner">
    <h3 class="receive-title">선물을 받을 때</h3>
    <p class="receive-desc">
      상품을 보여주기전 블라인드 된 이미지로<br>
      더욱 더 선물에 대한 설렘과 기대감을 증폭켜줍니다
    </p>

    <div class="receive-stage">
      <img class="receive-sticker receive-sticker--cloud" style="--i:0" src="__STICKER_CLOUD__" alt="">
      <img class="receive-sticker receive-sticker--star-left" style="--i:1" src="__STICKER_STAR__" alt="">
      <img class="receive-sticker receive-sticker--star-right" style="--i:2" src="__STICKER_BUTTON__" alt="">
      <img class="receive-sticker receive-sticker--berry" style="--i:3" src="__STICKER_BERRY__" alt="">
      <img class="receive-sticker receive-sticker--apple" style="--i:4" src="__STICKER_APPLE__" alt="">
      <img class="receive-sticker receive-sticker--heart" style="--i:5" src="__STICKER_HEART__" alt="">

      <div class="receive-card">
        <p class="receive-card-title">Happy Birthday</p>

        <div class="receive-card-faces" data-faces>
          <div class="receive-face is-active" data-face="0">
            <div class="receive-face-panel">
              <img src="__CARD1_URL__" alt="">
            </div>
          </div>
          <div class="receive-face" data-face="1">
            <div class="receive-face-panel receive-face-panel--photo">
              <img src="__CARD2_URL__" alt="[푸딩도트] 포켓북커버 A6 B6 A5 윅스">
            </div>
          </div>
          <div class="receive-face" data-face="2">
            <div class="receive-face-panel receive-face-panel--letter">
              <div class="receive-letter">
                <p>민솔이야 생일축하한다</p>
                <p>무더운 여름에 태어난줄 알았지만 사실은</p>
                <p>가장 따뜻하고 여름이 오기전 느지막히</p>
                <p>쌀쌀한 바람을 맞이할 수 있는</p>
                <p>그런 5월에 태어났구나 생일축하한다</p>
                <span class="receive-letter-from">From. 김조리돌림감자조림</span>
              </div>
            </div>
          </div>
        </div>

        <p class="receive-caption" data-caption>터치해서 친구가<br>보낸 선물을 확인해보세요!</p>
      </div>
    </div>

    <p class="receive-footer">
      보내는 사람이 잔뜩 꾸민<br>
      고민이 가득한 정성들인 메세지를 감상해보세요!
    </p>
  </div>
</section>
